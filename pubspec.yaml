name: laza
description: "E-Commerce Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.0.0

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5

  # Local Storage
  shared_preferences: ^2.2.0
  dio: ^5.4.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  google_sign_in: ^6.2.1
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/logo_light.png
    - assets/logo/logo_dark.png
    - assets/model.png
    - assets/images/